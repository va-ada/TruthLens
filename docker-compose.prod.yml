# ============================================================
# TruthLens — production overlay
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds Caddy (automatic HTTPS) in front of the app; the app itself is no longer published on the host.
# Required in .env: DOMAIN, ADMIN_TOKEN (>=16 chars). Recommended: GEMINI_API_KEY, LLM_DAILY_BUDGET.
# ============================================================

services:
  truthlens:
    ports: !reset []
    environment:
      - VERCEL=
      - TRUTHLENS_DATA_DIR=/app/storage
      - APP_ENV=production
      # Client IPs come from Caddy's X-Forwarded-For (needed for per-IP rate limits)
      - TRUST_PROXY=1
    expose:
      - "8000"
    mem_limit: ${TRUTHLENS_MEM_LIMIT:-3g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.8-alpine
    container_name: truthlens-caddy
    restart: unless-stopped
    depends_on:
      truthlens:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env (e.g. truthlens.example.com, or localhost for a local test)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
    name: truthlens-caddy-data
  caddy-config:
    name: truthlens-caddy-config
