# ============================================================
# TruthLens — Docker Compose
# ============================================================
# Single-service stack with named volumes for data persistence.
# ChromaDB and SQLite survive container rebuilds.
#
# Usage:
#   docker compose up --build        # Build & start
#   docker compose down              # Stop
#   docker compose logs -f           # Stream logs
#   docker compose up --build -d     # Detached mode
# ============================================================

services:
  truthlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truthlens
    ports:
      # Localhost only; set TRUTHLENS_PORT in .env if 8000 is taken on the host
      - "127.0.0.1:${TRUTHLENS_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Ensure IS_VERCEL is NOT set inside Docker
      - VERCEL=
      # All runtime data (ChromaDB, SQLite, uploads) lives under one volume, away from the code
      - TRUTHLENS_DATA_DIR=/app/storage
    volumes:
      # Never mount over code directories (a volume on backend/database/ froze db.py inside it)
      - truthlens-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8000/health', timeout=8); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      # Model warm-up (embedder, reranker, DeBERTa) can take >60 s on a small or busy CPU
      start_period: 180s
      retries: 3

volumes:
  truthlens-storage:
    name: truthlens-storage
