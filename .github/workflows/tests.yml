name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Embedder, MS-MARCO reranker and DeBERTa NLI (~1 GB) are downloaded once and cached
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('backend/config.py', 'backend/services/nlp/nli_evaluator.py', 'backend/services/rag/local_reranker.py') }}

      - name: Run tests (network tests excluded by pytest.ini)
        run: pytest -q
